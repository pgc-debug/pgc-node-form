<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelResizer - Free Online Image Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="#" class="logo">📸 PixelResizer</a>
        <div style="color: var(--text-muted); font-size: 14px;">⚡ 100% Free - Safe KB Resizer</div>
    </header>
    <div class="ad-banner-top">
        <div class="ad-placeholder" style="height: 90px; width: 100%;">[💰 PLACE TOP BANNER AD CODE HERE]</div>
    </div>
    <div class="main-wrapper">
        <main class="tool-card">
            <h2 style="margin-bottom: 8px;">Ultimate Image Workspace</h2>
            <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 15px;">Resize, compress, or convert your images instantly.</p>
            <div class="tab-container">
                <button id="tabResize" class="tab-btn active-tab" type="button">Dimensions (px)</button>
                <button id="tabTargetKB" class="tab-btn" type="button">Resize to KB</button>
            </div>
            <label for="fileInput" class="drop-zone" id="dropZone">
                <p id="fileInfo" style="font-weight: 600; margin: 0; color: #475569;">📁 Click Here to Browse or Drag Image</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </label>
            <div id="toolSettings" style="display: none;">
                <div id="resizeSection" style="display: block;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                        <div>
                            <label style="font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px;">Width (px):</label>
                            <input type="number" id="targetWidth">
                        </div>
                        <div>
                            <label style="font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px;">Height (px):</label>
                            <input type="number" id="targetHeight">
                        </div>
                    </div>
                    <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="maintainAspectRatio" checked style="width: auto; cursor: pointer;">
                        <label for="maintainAspectRatio" style="font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer;">Keep aspect ratio</label>
                    </div>
                    <label style="font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px;">Target Format Extension:</label>
                    <select id="targetFormat" style="margin-bottom: 15px;">
                        <option value="image/jpeg">JPG / JPEG</option>
                        <option value="image/png">PNG</option>
                        <option value="image/webp">WebP</option>
                    </select>
                </div>
                <div id="targetKBSection" style="display: none; margin-bottom: 15px;">
                    <label style="font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px;">Choose Desired File Size Limit:</label>
                    <select id="targetKBValue">
                        <option value="20">Under 20 KB (Passport Size / Signature)</option>
                        <option value="50">Under 50 KB (Govt Job Forms)</option>
                        <option value="100">Under 100 KB (Admission Portals)</option>
                        <option value="200">Under 200 KB (Standard Documents)</option>
                        <option value="500">Under 500 KB (High Quality Web View)</option>
                    </select>
                </div>
                <button id="processBtn" class="main-btn" type="button">✨ Process & Download</button>
            </div>
        </main>
        <aside class="ad-sidebar">
            <h4 style="margin-bottom: 15px; color: var(--text-muted); font-size: 14px;">Sponsored Links</h4>
            <div class="ad-placeholder" style="height: 300px; width: 100%;">[💰 PLACE SIDEBAR BANNER AD CODE HERE]</div>
        </aside>
    </div>
