<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Submission Form</title>
    <link rel="stylesheet" href="fstyle.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>User Submission Form</h2>
            <form id="userForm">
                <input type="text" id="name" placeholder="Enter Name" required>
                <input type="email" id="email" placeholder="Enter Email" required>
                <textarea id="message" placeholder="Enter Message" rows="4" required></textarea>
                <button type="submit">Submit Data</button>
            </form>
            <p id="formStatus"></p>
        </div>
    </div>

    <script>
        const userForm = document.getElementById('userForm');

        userForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                if(result.success) {
                    document.getElementById('formStatus').innerText = "✅ Data sent successfully!";
                    userForm.reset();
                }
            } catch (error) {
                document.getElementById('formStatus').innerText = "❌ Connection failed!";
            }
        });
    </script>
</body>
</html>
