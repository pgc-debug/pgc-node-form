<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🔗 Quick URL Shortener</h2>
            <p>Paste your long link below to get a short link.</p>
            <form id="shortenForm">
                <input type="url" id="longUrl" placeholder="https://example.com" required>
                <button type="submit">Shorten Link</button>
            </form>
            
            <div id="resultBox" style="display: none; margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 5px;">Your Short Link:</p>
                <input type="text" id="shortUrl" readonly style="margin-bottom: 5px; background: #fff;">
                <button id="copyBtn" style="background: #007bff; width: auto; padding: 5px 15px;">Copy</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('shortenForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const originalUrl = document.getElementById('longUrl').value;

            const response = await fetch('/api/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ originalUrl })
            });
            const data = await response.json();
            if(data.success) {
                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('shortUrl').value = data.shortUrl;
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const copyText = document.getElementById('shortUrl');
            copyText.select();
            document.execCommand('copy');
            alert('Link Copied!');
        });
    </script>
</body>
</html>
